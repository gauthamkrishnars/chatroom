<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>PulseChat | Realtime Community & Team Rooms</title>
    <meta name="title" content="PulseChat | Realtime Community & Team Rooms" />
    <meta name="description" content="Instant real-time chat rooms powered by Firebase and React. Join public topic rooms, create community spaces, and message friends live with zero lag." />
    <meta name="keywords" content="chat room, realtime chat, react chat, firebase firestore, community chat, group messaging" />
    <meta name="author" content="PulseChat Technologies" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Favicon Links -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pulsechat.app/" />
    <meta property="og:title" content="PulseChat | Realtime Community & Team Rooms" />
    <meta property="og:description" content="Instant real-time chat rooms powered by Firebase and React. Join public topic rooms, create community spaces, and message friends live with zero lag." />
    <meta property="og:image" content="https://pulsechat.app/og-preview.png" />
    <meta property="og:site_name" content="PulseChat" />

    <!-- Twitter Cards -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://pulsechat.app/" />
    <meta property="twitter:title" content="PulseChat | Realtime Community & Team Rooms" />
    <meta property="twitter:description" content="Instant real-time chat rooms powered by Firebase and React. Join public topic rooms, create community spaces, and message friends live with zero lag." />
    <meta property="twitter:image" content="https://pulsechat.app/og-preview.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "PulseChat",
      "url": "https://pulsechat.app/",
      "description": "Instant real-time chat rooms powered by Firebase and React. Join public topic rooms, create community spaces, and message friends live with zero lag.",
      "applicationCategory": "CommunicationApplication",
      "operatingSystem": "All modern web browsers",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Real-time message synchronization with Firebase Firestore",
        "Google Sign In and Email/Password authentication",
        "Custom chat room creation and discovery",
        "Live presence indicators and instant timestamps",
        "Mobile-first responsive interface"
      ]
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
